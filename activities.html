<script>
  // Render การ์ดกิจกรรมแต่ละหมวดจาก ACTIVITIES (js/data/activities.js) ผ่าน <activity-card>
  document.querySelectorAll('[data-activity-category]').forEach(container => {
    const category = container.dataset.activityCategory;
    ACTIVITIES.filter(a => a.category === category).forEach(data => {
      const card = document.createElement('activity-card');
      card.activity = data;
      container.appendChild(card);
    });
  });
</script>
